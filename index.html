<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14263d">
<meta name="referrer" content="no-referrer">
<title>BRZ Replacement</title>
<style>
:root { color-scheme:light; font-family:Inter,Arial,system-ui,sans-serif }
* { box-sizing:border-box }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f3f6fa }
#app { position:absolute; inset:0; width:100%; height:100%; display:none; border:0; background:#fff }
#app.loaded { display:block }
#waiting { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:28px 15px; background:linear-gradient(145deg,#10233c,#1a3a5c); color:#e8f0f8 }
#waiting.hidden { display:none }
.panel { width:min(460px,100%); padding:36px 31px; text-align:center }
.mark { width:56px; height:56px; border:2px solid #9ec2d8; border-radius:15px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900; color:#fff; margin:0 auto 28px }
h1 { font-size:27px; margin:0 0 8px; letter-spacing:-.6px }
.sub { margin:0 0 28px; color:#a3bdd6; font-size:14px }
.progress { height:5px; border-radius:99px; overflow:hidden; background:#2d4f70; margin:0 0 17px }
.bar { height:100%; width:8%; border-radius:99px; background:#22b8a1; transition:width .25s ease }
#status { font-size:13px; color:#d2e3ee; min-height:43px; line-height:1.5; margin:0 }
.caption { font-size:12px; color:#8fb0c9; margin-top:23px; line-height:1.6 }
#retry { display:none; cursor:pointer; background:#13a99a; color:#062b33; font-weight:700; border:0; border-radius:6px; padding:12px 20px; margin-top:16px; font-size:14px }
#retry.visible { display:inline-block }
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style>
</head>
<body>
<main id="waiting" aria-live="polite">
 <div class="panel">
  <div class="mark">BRZ</div>
  <h1>BRZ Replacement</h1>
  <p class="sub">Replacement Engine · Safras e mercado físico</p>
  <div class="progress" role="progressbar" aria-label="Carregamento" aria-valuemin="0" aria-valuemax="100" id="prog"><div class="bar" id="bar"></div></div>
  <p id="status">Abrindo a versão de consulta…</p>
  <button id="retry" type="button">Tentar novamente</button>
  <div class="caption">Snapshot V4FQ · 13/11/2026 · Auditoria F62<br>Interface original com históricos locais · não depende de login ou consulta ao banco para abrir</div>
 </div>
</main>
<iframe id="app" title="BRZ Replacement" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
<script>
(()=>{'use strict';
 const files=['assets/v4fq/snapshot_00.bin','assets/v4fq/snapshot_01.bin',
 'assets/v4fq/snapshot_02.bin','assets/v4fq/snapshot_03.bin',
 'assets/v4fq/snapshot_04.bin','assets/v4fq/snapshot_05.bin',
 'assets/v4fq/snapshot_06.bin','assets/v4fq/snapshot_07.bin'];
 const expectedBytes=4433600;
 const expectedSha='4ce6b739557f8ea44421f87c9711845744fb3ebb824a5973ed1e4cdcfdc23395';
 const status=document.getElementById('status'),waiting=document.getElementById('waiting'),
   frame=document.getElementById('app'),bar=document.getElementById('bar'),retry=document.getElementById('retry');
 let loading=false,objectUrl=null;
 function update(message,pct){status.textContent=message;bar.style.width=pct+'%';document.getElementById('prog').setAttribute('aria-valuenow',String(pct));}
 function fail(e){loading=false;update('Não foi possível abrir o snapshot: '+(e&&e.message||'erro desconhecido'),0);retry.classList.add('visible');}
 async function boot(){
  if(loading)return;loading=true;retry.classList.remove('visible');
  if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}
  frame.classList.remove('loaded');waiting.classList.remove('hidden');
  try{
   if(!('DecompressionStream' in window)||!window.crypto?.subtle)
     throw Error('Este navegador não oferece descompactação/validação nativas. Atualize o Chrome.');
   update('Baixando o histórico compactado (4,4 MB)…',5);
   let completed=0;
   const parts=await Promise.all(files.map(async(path)=>{
     const res=await fetch(path,{cache:'default'});
     if(!res.ok||res.type==='opaque')throw Error('Arquivo indisponível: '+path+' ('+res.status+')');
     const bytes=await res.arrayBuffer();
     completed++;
     update('Transferindo dados: '+completed+' de '+files.length+' partes',Math.min(75,5+Math.round(completed/files.length*70)));
     return bytes;
   }));
   const bytes=parts.reduce((n,p)=>n+p.byteLength,0);
   if(bytes!==expectedBytes)throw Error('Tamanho do histórico divergente');
   const packed=new Blob(parts,{type:'application/octet-stream'});
   update('Conferindo integridade do snapshot…',78);
   const hash=await crypto.subtle.digest('SHA-256',await packed.arrayBuffer());
   const hex=Array.from(new Uint8Array(hash),v=>v.toString(16).padStart(2,'0')).join('');
   if(hex!==expectedSha)throw Error('SHA-256 divergente. A versão não será aberta.');
   update('Preparando a interface original…',86);
   const html=await new Response(packed.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
   if(html.size!==59875040)throw Error('Dados descompactados incompletos');
   objectUrl=URL.createObjectURL(new Blob([html],{type:'text/html;charset=UTF-8'}));
   update('Inicializando o motor financeiro e os gráficos…',94);
   frame.onload=()=>{
    try{
     if(!frame.contentDocument?.querySelector('.app'))throw Error('Interface original não encontrada');
     if(!frame.contentDocument?.querySelector('.topnav'))throw Error('Navegação original não encontrada');
     frame.classList.add('loaded');waiting.classList.add('hidden');
     update('Replacement carregado',100);
     // F60 e isolado do motor financeiro; falha do diagnostico nao bloqueia a plataforma.
     try{
       const ops=frame.contentDocument.createElement('script');
       ops.src=new URL('assets/ops/f60_runtime.js?v=20261116f62',location.href).href;
       ops.async=true;
       ops.onerror=()=>console.warn('BRZ F60: diagnostico indisponivel, operacao legada preservada');
       frame.contentDocument.body.appendChild(ops);
     }catch(e){console.warn('BRZ F60: nao foi possivel inicializar diagnostico',e);}
    }catch(e){fail(e);}
   };
   frame.onerror=()=>fail(Error('Falha ao carregar a interface original'));
   frame.src=objectUrl;
  }catch(e){fail(e);}
 }
 retry.onclick=boot;
 boot();
})();
</script>
</body>
</html>
